<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>পৃষ্ঠাটি পাওয়া যায়নি (৪০৪) | তানভীর ট্রেডার্স</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="shortcut icon" href="public/favicon.ico" />
  <link rel="icon" href="public/favicon.ico" sizes="32x32" type="image/x-icon" />
  <link rel="icon" href="public/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="icon" href="public/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="public/apple-touch-icon.png" sizes="180x180" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .error-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }

    .error-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 48px 36px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-xl);
      animation: fadeUp 0.6s ease-out;
    }

    .error-badge {
      display: inline-block;
      font-size: 80px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--orange-500), #dc2626);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .error-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--slate-900);
      margin-bottom: 12px;
    }

    .error-desc {
      font-size: 15px;
      color: var(--slate-600);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--orange-500), var(--orange-600));
      color: #fff;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(249, 115, 22, 0.35);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.45);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      color: var(--slate-700);
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 12px;
      text-decoration: none;
      border: 1px solid var(--slate-200);
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--slate-50);
      border-color: var(--slate-300);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <!-- Animated Background Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        <div class="nav-logo">
          <img src="public/icon.svg" alt="Tanvir Traders Logo" width="32" height="32" />
        </div>
        <div class="nav-title">
          <span class="nav-title-main">Tanvir Traders</span>
          <span class="nav-title-sub">ডিলারশিপ পোর্টাল</span>
        </div>
      </a>
    </div>
  </nav>

  <main class="error-wrapper">
    <div class="error-card">
      <div class="error-badge">৪০৪</div>
      <h1 class="error-title">পৃষ্ঠাটি খুঁজে পাওয়া যায়নি</h1>
      <p class="error-desc">
        আপনি যে লিংকটি অনুসন্ধান করছেন তা পরিবর্তিত হয়েছে অথবা বর্তমানে উপলব্ধ নেই। অনুগ্রহ করে মূল ডিলারশিপ পোর্টালে ফিরে যান।
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          হোমপেজে ফিরে যান
        </a>
        <a href="https://tanvir-traders-akij.vercel.app/" class="btn-secondary" target="_blank" rel="noopener noreferrer">
          আকিজ পোর্টাল
        </a>
        <a href="https://tanvir-traders-fresh.vercel.app/" class="btn-secondary" target="_blank" rel="noopener noreferrer">
          ফ্রেশ পোর্টাল
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" id="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="public/icon.svg" alt="logo" width="24" height="24" />
        <span>তানভীর ট্রেডার্স</span>
      </div>
      <p class="footer-copy">© ২০২৬ Tanvir Traders. সর্বস্বত্ব সংরক্ষিত।</p>
    </div>
  </footer>
</body>

</html>
